name: NINE source verification
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  offline-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:security:offline
      - run: npm run check:imports
      - run: npm run check:syntax
      - run: npm run check:offline-only
      - run: npm run check:security:phase22
      - run: npm run check:security:phase23
      - run: npm run check:plan-dates
      - run: npm run check:migration:phase24
      - run: npm run check:security:phase25
      - run: npm run check:security:phase26
      - run: npm run check:security:phase27
      - run: npm run check:security:phase28
      - run: npm run check:security:phase29
      - run: npm run check:http:phase30
      - run: npm run check:phase31
      - run: npm run check:phase32
      - run: npm run check:phase33
      - run: npm run check:phase34
      - run: npm run check:phase35
      - run: npm run check:phase36
      - run: npm run check:phase37
      - run: npm run check:phase38
      - run: npm run check:phase39-44
      - run: npm run check:phase45-49
      - run: npm run check:phase50-54
      - run: npm run check:phase55-60
      - run: npm run check:phase61-68
      - run: npm run check:phase69-76
      - run: npm run check:phase77-84
      - run: npm run check:phase85-92
      - run: npm run check:phase93-100
      - run: npm run check:phase101-108
      - run: npm run check:phase109-116
      - run: npm run check:phase133-140
      - run: npm run check:phase141-148
      - run: npm run check:phase149-156
      - run: npm run check:phase157-164
      - run: npm run check:phase117-124
      - run: npm run check:branch:phase17
      - run: npm run check:security:phase18
      - run: npm run check:security:phase19
      - run: node scripts/check-phase16-branch.cjs
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run check:production-artifact
      - run: npm run verify:build
      - run: npm run report:inventory

      - name: Check phase 125-132 source revisions
        run: npm run check:phase125-132
